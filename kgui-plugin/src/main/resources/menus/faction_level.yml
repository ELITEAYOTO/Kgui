  # ============================================================================
  level_4:
    slot: 40
    material: STAINED_GLASS_PANE
    data: 5
    hide_attributes: true
    kgui_protected: true
    display_name: "&a&lNiveau 4"
    lore:
      - ""
      - "&7XP Requis: &e5000"
      - ""
      - "&7Debloque:"
      - "&8▸ &e+1 F-Warp"
      - "&8▸ &bFly Faction"
    priority: 10

  # ============================================================================
  # NIVEAU 5 (slot 41)
  # ============================================================================
  level_5:
    slot: 41
