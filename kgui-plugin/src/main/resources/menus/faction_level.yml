      - ""
      - "&7Debloque:"
      - "&8▸ &cAnti-Sethome"
    priority: 10

  # ============================================================================
  # NIVEAU 3 (slot 32)
  # ============================================================================
  level_3:
    slot: 32
    material: STAINED_GLASS_PANE
    data: 5
    hide_attributes: true
    kgui_protected: true
    display_name: "&a&lNiveau 3"
    lore:
      - ""
