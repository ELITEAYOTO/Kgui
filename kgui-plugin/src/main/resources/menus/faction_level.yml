    data: 1
    hide_attributes: true
    kgui_protected: true
    display_name: "&6&lNiveau 5"
    lore:
      - ""
      - "&7XP Requis: &e8000"
      - ""
      - "&7Debloque:"
      - "&8▸ &e+2 Membres max"
      - "&8▸ &a+100 PlayerPoints (Chef)"
    priority: 10

  # ============================================================================
  # INFO (slot 49)
  # ============================================================================
  info_button:
    slot: 49
    material: CLAY_BALL
    cit: gear
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lInfos"
    lore:
      - "&8---------------"
      - "&7Complete des quetes pour"
      - "&7gagner de l'XP et monter"
      - "&7en niveau."
      - ""
      - "&7Chaque niveau debloque des"
      - "&7recompenses permanentes!"
      - "&8---------------"

  # ============================================================================
  # RETOUR (slot 45)
  # ============================================================================
  back_button:
    slot: 45
    material: ARROW
    hide_attributes: true
    kgui_protected: true
    display_name: "&c&l◄ Retour"
    lore:
      - ""
      - "&7Retourner aux upgrades"
    
    click_actions:
      - "[sound] CLICK 1.0 0.8"
      - "[open] faction_upgrades"
