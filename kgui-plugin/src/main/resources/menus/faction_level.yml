schema_version: 2
# ==============================================================================
# KGUI - NIVEAU FACTION (faction_level.yml)
# ==============================================================================
# Vue d'ensemble du niveau de faction avec progression et rewards
#
# OUVERTURE: Via faction_upgrades.yml (slot stats) ou /f level
# PLACEHOLDERS UTILISES:
#   %kfaction_faction_level%        - Niveau actuel
#   %kfaction_faction_xp%           - XP actuel
#   %kfaction_faction_required_xp%  - XP requis pour le prochain niveau
#   %kfaction_faction_progressbar%  - Barre de progression XP
#   %kfaction_faction_category%     - Categorie de quetes active
#   %kfaction_faction_quests_remaining% - Quetes restantes
#   %kfaction_faction_has_chest%    - Si coffre debloque
#   %kfaction_faction_has_fly%      - Si fly debloque
#   %kfaction_faction_has_antisethome% - Si anti-sethome debloque
# ==============================================================================

title: "&6【 &e&lNiveau Faction &6】"
size: 54
type: normal

block_in_combat: true
cooldown: 2
update_interval: 20

open_requirements:
  check_faction:
    type: has_faction
    deny_message: "&c✖ Tu dois etre dans une faction!"

# ==============================================================================
# ITEMS
# ==============================================================================
items:

  # ============================================================================
  # BACKGROUNDS
  # ============================================================================
  background:
    slots: "0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,46,47,48,50,51,52,53"
    material: CLAY_BALL
    cit: background_2
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "
    
  background2:
    slots: "10,11,14,15,16,19,24,25,28,29,33,34,37,38,39,42,43"
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "

  # ============================================================================
  # TITRE - Niveau actuel (slot 4)
  # ============================================================================
  title_item:
    slot: 4
    material: BEACON
    glow: true
    hide_attributes: true
    kgui_protected: true
    display_name: "&6&l⭐ Niveau %kfaction_faction_level%"
    lore:
      - ""
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - ""
      - "&7XP: &a%kfaction_faction_xp% &7/ &a%kfaction_faction_required_xp%"
      - ""
      - "&7%kfaction_faction_progressbar%"
      - ""
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    priority: 10

  # ============================================================================
  # QUETES - Bouton principal (slot 12)
  # ============================================================================
  quests_button:
    slot: 12
    material: BOOK_AND_QUILL
    hide_attributes: true
    kgui_protected: true
    display_name: "&6&l⚡ Quetes"
    lore:
      - ""
      - "&7Complete des quetes pour"
      - "&7gagner de l'XP et monter"
      - "&7en niveau!"
      - ""
      - "&7Categorie: &e%kfaction_faction_category%"
      - "&7Quetes restantes: &e%kfaction_faction_quests_remaining%"
      - ""
      - "&e▸ Clic pour voir les quetes"
    priority: 10
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_quests"

  # ============================================================================
  # CATEGORIE - Choix de categorie (slot 13)
  # ============================================================================
  category_button:
    slot: 13
    material: COMPASS
    hide_attributes: true
    kgui_protected: true
    display_name: "&3&l☰ Categorie"
    lore:
      - ""
      - "&7Choisis la categorie de"
      - "&7quetes pour ta faction."
      - ""
      - "&7Active: &e%kfaction_faction_category%"
      - ""
      - "&7Categories:"
      - "&8▸ &7⛏ &fMineur"
      - "&8▸ &a☘ &fFarmer"
      - "&8▸ &c⚔ &fChasseur"
      - ""
      - "&b▸ Clic pour choisir"
    priority: 10
    
    view_requirements:
      - "faction_role: MODERATOR"
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_quest_category"

  # ============================================================================
  # RECOMPENSES - Arbre des rewards (slot 20)
  # ============================================================================
  rewards_button:
    slot: 20
    material: NETHER_STAR
    glow: true
    hide_attributes: true
    kgui_protected: true
    display_name: "&a&l✦ Recompenses"
    lore:
      - ""
      - "&7Voir toutes les recompenses"
      - "&7debloquables par niveau."
      - ""
      - "&7Niveaux disponibles: &e1 - 10"
      - ""
      - "&a▸ Clic pour voir"
    priority: 10
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_rewards"

  # ============================================================================
  # F-CHEST (slot 21)
  # ============================================================================
  chest_status:
    slot: 21
    material: CHEST
    hide_attributes: true
    kgui_protected: true
    display_name: "&6&l✦ Coffre Faction"
    lore:
      - ""
      - "&7Status: %kfaction_faction_has_chest_display%"
      - ""
      - "&7Stockage partage entre"
      - "&7tous les membres."
      - ""
      - "&e▸ Clic pour ouvrir"
    priority: 10
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[player] f chest"

  # ============================================================================
  # F-FLY (slot 22)
  # ============================================================================
  fly_status:
    slot: 22
    material: FEATHER
    hide_attributes: true
    kgui_protected: true
    display_name: "&b&l✈ Fly Faction"
    lore:
      - ""
      - "&7Status: %kfaction_faction_has_fly_display%"
      - ""
      - "&7Voler dans vos territoires."
      - ""
      - "&e▸ Clic pour basculer"
    priority: 10
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[player] f fly"

  # ============================================================================
  # ANTI-SETHOME (slot 23)
  # ============================================================================
  antisethome_status:
    slot: 23
    material: TRIPWIRE_HOOK
    hide_attributes: true
    kgui_protected: true
    display_name: "&c&l⛨ Anti-Sethome"
    lore:
      - ""
      - "&7Status: %kfaction_faction_has_antisethome_display%"
      - ""
      - "&7Empeche les ennemis de"
      - "&7placer des homes dans"
      - "&7vos territoires."
    priority: 10

  # ============================================================================
  # NIVEAU 1 (slot 30)
  # ============================================================================
  level_1:
    slot: 30
    material: STAINED_GLASS_PANE
    data: 5
    hide_attributes: true
    kgui_protected: true
    display_name: "&a&lNiveau 1"
    lore:
      - ""
      - "&7XP Requis: &e500"
      - ""
      - "&7Debloque:"
      - "&8▸ &6Coffre Faction &7(4 lignes)"
      - "&8▸ &e+1 F-Warp"
    priority: 10

  # ============================================================================
