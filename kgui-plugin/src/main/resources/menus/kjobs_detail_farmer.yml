      - "[close]"

  quetes:
    slot: 34
    material: COMPASS
    display_name: "&5&lQuêtes &8[&7À venir&8]"
    lore:
      - ""
      - "&7Un système de quêtes liées"
      - "&7au Farmeur arrive bientôt."
      - ""
      - "&c✘ Phase 10 — Non disponible"
    hide_attributes: true
    kgui_protected: true

  # ─── Navigation (ligne 5) ──────────────────────────────────────
  retour:
    slot: 48
    material: CLAY_BALL
    cit: arrow_left_hebreu
    display_name: "&c&lRetour"
    lore:
      - ""
      - "&8▸ &7Retour aux Métiers"
    hide_attributes: true
    kgui_protected: true
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] kjobs_main"
