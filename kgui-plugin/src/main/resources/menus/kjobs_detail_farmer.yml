    kgui_protected: true

  activer_job:
    slot: 31
    material: EMERALD
    display_name: "&a&l✔ Définir comme job actif"
    lore:
      - ""
      - "&7Définit le Farmeur comme votre"
      - "&7job principal affiché sur le HUD."
