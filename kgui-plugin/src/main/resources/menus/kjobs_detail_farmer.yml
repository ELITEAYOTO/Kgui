title: "&8✿ &a&lFarmeur &8— Détails"
size: 54
type: normal
update_interval: 20

items:

  # ─── Fond ──────────────────────────────────────────────────────
  background:
    slots: "0-3,5-9,11,13,15-27,29,30,32,33,35-47,49-53"
    material: CLAY_BALL
    cit: BackgroundHebreu2
    display_name: " "
    hide_attributes: true
    kgui_protected: true

  # ─── Icône centrale du job (slot 4) ────────────────────────────
  job_icon:
    slot: 4
    material: CLAY_BALL
    cit: farmer
    display_name: "&a&l✿ Farmeur"
    lore:
      - ""
      - "&7Le Farmeur cultive et récolte"
      - "&7les ressources naturelles."
      - ""
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - "&7Niveau:     &e%kjob_level_farmer% &8/ &e%kjob_max_level_farmer%"
      - "&7XP actuel:  &a%kjob_xp_farmer%"
      - "&7XP requis:  &a%kjob_xp_next_farmer%"
      - "&7Progression: &e%kjob_percent_farmer%%"
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    hide_attributes: true
    kgui_protected: true

  # ─── Statistiques (ligne 1) ────────────────────────────────────
  stat_niveau:
    slot: 10
    material: GOLD_INGOT
    display_name: "&e&lNiveau actuel"
    lore:
      - ""
      - "&f%kjob_level_farmer% &8/ &7%kjob_max_level_farmer%"
      - ""
      - "&7XP pour progresser:"
      - "&8▸ &a%kjob_xp_farmer% &8/ &a%kjob_xp_next_farmer% XP"
    hide_attributes: true
    kgui_protected: true

  stat_progression:
    slot: 12
    material: REDSTONE
    display_name: "&a&lProgression"
    lore:
      - ""
      - "&7Progression dans le niveau:"
      - "&8▸ &e%kjob_percent_farmer%%"
      - ""
      - "&7XP actuel:  &a%kjob_xp_farmer%"
      - "&7XP requis:  &a%kjob_xp_next_farmer%"
    hide_attributes: true
    kgui_protected: true

  stat_slots:
    slot: 14
    material: CHEST
    display_name: "&6&lSlots débloqués"
    lore:
      - ""
      - "&7Slots actifs: &e%kjob_slots%"
