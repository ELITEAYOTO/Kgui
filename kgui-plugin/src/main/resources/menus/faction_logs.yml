schema_version: 2
# ==============================================================================
# KGUI - LOGS DE FACTION - TOUS (faction_logs.yml)
# ==============================================================================
# Menu paginé affichant TOUS les logs de faction
# Filtre actif: ALL
#
# OUVERTURE: /f logs ou depuis faction_menu.yml
# ==============================================================================

title: "&6【 &e&lLogs &6】&8Page %page%/%max_page%"
size: 54
type: paginated

pagination:
  enabled: true
  content_slots: "10-16,19-25,28-34,37-43"
  prev_button_slot: 48
  next_button_slot: 50
  provider: "kfaction_logs"

block_in_combat: true
cooldown: 1
update_interval: 40

open_requirements:
  check_faction:
    type: has_faction
    deny_message: "&c✖ Tu dois être dans une faction!"
  check_permission:
    type: faction_role
    role: MODERATOR
    deny_message: "&c✖ Tu dois être Modérateur minimum!"

# ==============================================================================
# ITEMS
# ==============================================================================
items:

  # ============================================================================
  # BACKGROUNDS - Bordures
  # ============================================================================
  border_top:
    slots: "0,8"
    material: CLAY_BALL
    cit: background_2
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "

  border_sides:
    slots: "9,17,18,26,27,35,36,44"
    material: CLAY_BALL
    cit: background_2
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "

  border_bottom:
    slots: "46,47,51,52,53"
    material: CLAY_BALL
    cit: background_2
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "

  # ============================================================================
  # FILTRES - Ligne du haut (slots 1-7)
  # Filtre ALL = ACTIF (glow)
  # ============================================================================
  
  filter_all:
    slot: 1
    material: NETHER_STAR
    glow: true
    hide_attributes: true
    kgui_protected: true
    display_name: "&f&l★ Tous"
    lore:
      - ""
      - "&a✔ Filtre actif"
      - ""
      - "&7Affiche tous les logs"
      - "&7de ta faction."

  filter_members:
    slot: 2
    material: SKULL_ITEM
    data: 3
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&d&lMembres"
    lore:
      - ""
      - "&7Logs des membres:"
      - "&8▸ &fJoin / Leave / Kick"
      - "&8▸ &fPromotions / Rétrogradations"
      - ""
      - "&e▸ Clic pour filtrer"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_logs_members"

  filter_territory:
    slot: 3
    material: GRASS
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&2&lTerritoire"
    lore:
      - ""
      - "&7Logs du territoire:"
      - "&8▸ &fClaims / Unclaims"
      - "&8▸ &fSetHome / Warps"
      - ""
      - "&e▸ Clic pour filtrer"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_logs_territory"

  info_center:
    slot: 4
    material: CLAY_BALL
    cit: gear
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lHistorique"
    lore:
      - ""
      - "&7Les logs sont conservés"
      - "&7pendant &e36 heures&7."
      - ""
      - "&7Clique sur un filtre"
      - "&7pour affiner la recherche."

  filter_economy:
    slot: 5
    material: GOLD_INGOT
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&a&lÉconomie"
    lore:
      - ""
      - "&7Logs de la banque:"
      - "&8▸ &fDépôts / Retraits"
      - ""
      - "&e▸ Clic pour filtrer"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_logs_economy"

  filter_tp:
    slot: 6
    material: ENDER_PEARL
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&b&lTéléportation"
    lore:
      - ""
      - "&7Logs des TP:"
      - "&8▸ &fTP Home / Warp"
      - ""
      - "&e▸ Clic pour filtrer"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] faction_logs_tp"

  filter_chest:
    slot: 7
    material: CHEST
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&6&lF-Chest"
    lore:
      - ""
      - "&c⚠ Bientôt disponible"
      - ""
      - "&7Logs des coffres faction"
    priority: -1

  # ============================================================================
  # NAVIGATION - Ligne du bas
  # ============================================================================
  
  back_button:
    slot: 45
    material: ARROW
    hide_attributes: true
    kgui_protected: true
    display_name: "&c&l◄ Retour"
    lore:
      - ""
      - "&7Retourner au menu faction"
    click_actions:
      - "[sound] CLICK 1.0 0.8"
      - "[open] faction_menu"

  prev_page:
    slot: 48
    material: CLAY_BALL
    cit: arrow_left1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&l◄ Page Précédente"
    lore:
      - ""
      - "&7Page &f%page%&7/&f%max_page%"
    view_requirements:
      - "expression: %page% > 1"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[prev_page]"

  prev_page_disabled:
    slot: 48
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&7◄ Première Page"
    view_requirements:
      - "expression: %page% <= 1"
    priority: -1

  page_info:
    slot: 49
    material: PAPER
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lPage %page%/%max_page%"
    lore:
      - ""
      - "&7Filtre: &fTous"
      - ""
      - "&8Les logs les plus récents"
      - "&8sont affichés en premier."

  next_page:
    slot: 50
    material: CLAY_BALL
    cit: arrow_right1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lPage Suivante ►"
    lore:
      - ""
      - "&7Page &f%page%&7/&f%max_page%"
    view_requirements:
      - "expression: %page% < %max_page%"
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[next_page]"

  next_page_disabled:
    slot: 50
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&7Dernière Page ►"
    view_requirements:
      - "expression: %page% >= %max_page%"
    priority: -1

# ==============================================================================
# INJECTION DYNAMIQUE
# ==============================================================================
# Les logs sont injectés par Kfaction via KguiHook.openLogsMenuWithContent()
# Chaque log devient un PaginationItem affiché dans content_slots
#
# Format d'un log:
#   Material: selon le type (SKULL_ITEM, GRASS, GOLD_INGOT, ENDER_PEARL, PAPER)
#   Nom: "§8[HH:mm] §eJoueurActeur"
#   Lore:
#     - ""
#     - "§fTypeAction" (ex: Promotion, Claim, Dépôt)
#     - "§7→ §eJoueurCible" (si applicable)
#     - "§7(détails)" (si applicable)
#     - ""
#     - "§7Il y a: §f2h"
# ==============================================================================
