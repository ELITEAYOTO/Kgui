schema_version: 2
# ==============================================================================
# KGUI - PERMISSIONS RELATIONS (faction_perms_relations.yml)
# ==============================================================================
# Menu de gestion des permissions pour les RELATIONS (Allié, Ennemi, Neutre, Trêve)
# Permissions territoriales uniquement (ce que les autres peuvent faire chez vous)
# ==============================================================================

title: "&6【 &d&lRelations &6】 &8Permissions"
