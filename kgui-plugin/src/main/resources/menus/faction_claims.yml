schema_version: 2
# ==============================================================================
# KGUI - TERRITOIRES DE FACTION (faction_claims.yml)
# ==============================================================================
# Menu pagine affichant les claims de la faction
# Permet de voir les coordonnees et d'unclaim
# Le contenu dynamique est injecte par Kfaction
#
# OUVERTURE: Via faction_menu.yml
# ==============================================================================

title: "&6【 &2&lTerritoires &6】&7Page %page%/%max_page%"
size: 54
type: paginated

pagination:
  enabled: true
  content_slots: "10-16,19-25,28-34"
  prev_button_slot: 48
  next_button_slot: 50
  provider: "kfaction_claims"
  empty_message: "&cVotre faction ne possède aucun territoire."

block_in_combat: true
cooldown: 2
update_interval: 20

# ==============================================================================
# ITEMS
# ==============================================================================
items:

  # ============================================================================
  # BACKGROUNDS - Bordures orange
  # ============================================================================
  background:
    slots: "0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,46,47,51,52,53"
    material: CLAY_BALL
    cit: background_2
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "
    
  # ============================================================================
  # BACKGROUNDS - Jaune central
  # ============================================================================
  background2:
    slots: "37,38,39,40,41,42,43"
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: " "

  # ============================================================================
  # INFO CLAIMS (slot 4)
  # ============================================================================
  claims_info:
    slot: 4
    material: GRASS
    hide_attributes: true
    kgui_protected: true
    display_name: "&2&lTerritoires"
    lore:
      - ""
      - "&7Claims actuels: &e%kfaction_faction_claims%"
      - "&7Power total: &a%kfaction_faction_power%&7/&a%kfaction_faction_maxpower%"
      - ""
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - ""
      - "&7Cliquez sur un claim pour"
      - "&7voir les options (unclaim, etc.)"

  # ============================================================================
  # NAVIGATION - Page precedente
  # ============================================================================
  prev_page:
    slot: 48
    material: CLAY_BALL
    cit: arrow_left1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&l◄ Page Precedente"
    lore:
      - ""
      - "&7Page actuelle: &f%page%&7/&f%max_page%"
      - ""
      - "&e▸ Clic pour retourner"
    
    view_requirements:
      - "expression: %page% > 1"
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[prev_page]"

  prev_page_disabled:
    slot: 48
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&7◄ Premiere Page"
    
    view_requirements:
      - "expression: %page% <= 1"
    priority: -1

  # ============================================================================
  # INFO PAGE (slot 49)
  # ============================================================================
  page_info:
    slot: 49
    material: MAP
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lPage %page%/%max_page%"
    lore:
      - ""
      - "&7Claims: &f%kfaction_faction_claims%"

  # ============================================================================
  # NAVIGATION - Page suivante
  # ============================================================================
  next_page:
    slot: 50
    material: CLAY_BALL
    cit: arrow_right1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&e&lPage Suivante ►"
    lore:
      - ""
      - "&7Page actuelle: &f%page%&7/&f%max_page%"
      - ""
      - "&e▸ Clic pour avancer"
    
    view_requirements:
      - "expression: %page% < %max_page%"
    
    click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[next_page]"

  next_page_disabled:
    slot: 50
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&7Derniere Page ►"
    
    view_requirements:
      - "expression: %page% >= %max_page%"
    priority: -1

  # ============================================================================
  # RETOUR (slot 45)
  # ============================================================================
  back_button:
    slot: 45
    material: ARROW
    hide_attributes: true
    kgui_protected: true
    display_name: "&c&l◄ Retour"
    lore:
      - ""
      - "&7Retourner au menu faction"
    
    click_actions:
      - "[sound] CLICK 1.0 0.8"
      - "[open] faction_menu"
  

# ==============================================================================
# TEMPLATE POUR LES CLAIMS (utilise par Kfaction pour injecter les items)
# ==============================================================================
# Chaque claim sera affiche comme:
#   material: GRASS
#   display_name: "&e<world> &7- &fX:<x> Z:<z>"
#   lore:
#     - ""
#     - "&7Monde: &f<world>"
#     - "&7Chunk: &eX:<chunk_x> Z:<chunk_z>"
#     - ""
#     - "&c▸ Clic pour unclaim"
#   click_actions:
#     - "[open] faction_confirm_unclaim"
# ==============================================================================
