    display_name: "&6Spawners à Squelette"
    lore:
    - "&8● &7Obtenable dans "
    - "&7la caisse spawners"

  prev_button:
    slot: 19
    material: CLAY_BALL
    cit: arrow_left1             # CIT directement dans le menu
    display_name: "&e&l◄ Page Précédente"
    lore:
      - "&7Page %page%/%max_page%"
    hide_attributes: true
    kgui_protected: true
    priority: 10
    view_requirements:
      - "expression: %page% > 1"
    click_actions:
      - "[prev_page]"
  
  prev_button_disabled:
    slot: 19
    material: CLAY_BALL
    cit: background_4         # ← CIT pour version désactivée (ou même CIT)
    display_name: " "
    hide_attributes: true
    kgui_protected: true
    priority: 1                       # ← Priorité basse

  next_button:
    slot: 25
    material: CLAY_BALL
    cit: arrow_right1
    display_name: "&e&lPage Suivante ►"
    lore:
      - "&7Page %page%/%max_page%"
    hide_attributes: true
    kgui_protected: true
    priority: 10
    view_requirements:
      - "expression: %page% < %max_page%"
    click_actions:
      - "[next_page]"

  next_button_disabled:
    slot: 25
    material: CLAY_BALL
    cit: background_4
    display_name: " "
    hide_attributes: true
    kgui_protected: true
    priority: 1
    