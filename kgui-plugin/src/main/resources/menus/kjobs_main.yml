    slot: 10
    material: CLAY_BALL
    cit: mineur
    display_name: "&b&lMineur"
    lore:
      - ""
      - "&7Extrait les minerais précieux"
      - "&7des profondeurs."
      - ""
      - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
