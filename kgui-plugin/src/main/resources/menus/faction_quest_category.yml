# ==============================================================================
# KGUI - CHOIX CATEGORIE QUETES (faction_quest_category.yml)
# ==============================================================================
# Menu de selection de categorie de quetes
# Seuls les MODERATOR+ peuvent changer la categorie
#
# OUVERTURE: Via faction_quests.yml ou faction_level.yml
# ACTIONS: Execute /f quest <categorie> pour changer
# ==============================================================================

title: "&6【 &3&lCategorie de Quetes &6】"
size: 54
type: normal

block_in_combat: true
cooldown: 2
update_interval: 20

open_requirements:
  check_faction:
    type: has_faction
    deny_message: "&c✖ Tu dois etre dans une faction!"
  check_role:
    type: faction_role
    role: MODERATOR
    deny_message: "&c✖ Seuls les moderateurs+ peuvent changer la categorie!"

