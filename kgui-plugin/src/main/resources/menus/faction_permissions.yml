# ==============================================================================
# KGUI - PERMISSIONS FACTION (faction_permissions.yml)
# ==============================================================================
# Menu pour gérer les permissions par rôle
# Les permissions sont toggleables (vert = active, rouge = désactivée)
#
# OUVERTURE: Via faction_menu.yml ou /f perms
#
# Ce menu utilise l'injection dynamique depuis Kfaction:
# - Les items de permission sont créés dynamiquement avec leur état actuel
# - Le toggle se fait via [player] f perm toggle <role> <permission>
# ==============================================================================

title: "&6【 &4&lPermissions &6】"
size: 54
type: normal

block_in_combat: true
cooldown: 2
update_interval: 20

