  # ============================================================================
  # PERMISSIONS - Templates (injectés dynamiquement par Kfaction)
  # ============================================================================
  # Ces items sont des placeholders visuels.
  # Kfaction remplace ces slots dynamiquement avec les vraies permissions.
  #
  # LAYOUT après sélection d'un rôle:
  # Ligne 2 (10-16): BUILD, DESTROY, SWITCH, CONTAINER, SPAWNER, TNT, (vide)
  # Ligne 3 (19-25): INVITE, KICK, PROMOTE, DEMOTE, HOME, SETHOME, WARP
  # Ligne 4 (28-34): CLAIM, UNCLAIM, DEPOSIT, WITHDRAW, TNT_DEPOSIT, TNT_WITHDRAW, TNT_FILL
  # Ligne 5 (37-43): RELATION_ALLY, RELATION_ENEMY, RELATION_NEUTRAL, RENAME, DESCRIPTION, PERMS, VIEW_LOGS
  #
  # Chaque permission affiche:
  # - Nom de la permission
  # - Description
  # - État actuel (✔ Active / ✖ Désactivée)
  # - Action: [player] f perm toggle <role> <permission>
  # ============================================================================

  # Placeholder - Affiche "Sélectionnez un rôle"
  placeholder_select_role:
    slots: "10-16,19-25,28-34,37-43"
    material: CLAY_BALL
    cit: background_1
    glow: false
    hide_attributes: true
    kgui_protected: true
    display_name: "&8Sélectionnez un rôle"
    lore:
      - ""
      - "&7Cliquez sur un rôle"
      - "&7en haut pour voir"
      - "&7ses permissions."
    priority: -10

# ==============================================================================
# PERMISSIONS REFERENCE (pour Kfaction)
# ==============================================================================
# Liste complète des PermissionAction disponibles:
#
# TERRITOIRE:
#   - BUILD        : Placer des blocs
#   - DESTROY      : Casser des blocs
#   - SWITCH       : Boutons, leviers, portes
#   - CONTAINER    : Coffres, fours, etc.
#   - SPAWNER      : Interagir avec les spawners
#   - TNT          : Placer de la TNT
#
# MEMBRES:
#   - INVITE       : Inviter des joueurs
#   - KICK         : Expulser des membres
#   - PROMOTE      : Promouvoir des membres
#   - DEMOTE       : Rétrograder des membres
#
# TÉLÉPORTATION:
#   - HOME         : Utiliser /f home
#   - SETHOME      : Définir le home
#   - WARP         : Utiliser les warps (futur)
#
# TERRITOIRE (gestion):
#   - CLAIM        : Claim des chunks
#   - UNCLAIM      : Unclaim des chunks
#
# ÉCONOMIE:
#   - DEPOSIT      : Déposer de l'argent
#   - WITHDRAW     : Retirer de l'argent
#   - TNT_DEPOSIT  : Déposer de la TNT
#   - TNT_WITHDRAW : Retirer de la TNT
#   - TNT_FILL     : Remplir les canons
#
# RELATIONS:
#   - RELATION_ALLY    : Gérer les alliés
#   - RELATION_ENEMY   : Déclarer des ennemis
#   - RELATION_NEUTRAL : Neutraliser une relation
#   - RELATION_TRUCE   : Gérer les trêves
#
# ADMINISTRATION:
#   - RENAME       : Renommer la faction
#   - DESCRIPTION  : Changer la description
#   - PERMS        : Modifier les permissions
#   - VIEW_LOGS    : Voir les logs
#   - DISBAND      : Dissoudre (Leader only)
#   - TRANSFER     : Transférer (Leader only)
# ==============================================================================
