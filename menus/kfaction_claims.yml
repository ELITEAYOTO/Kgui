# Menu des territoires claim d'une faction
# Utilise le provider "kfaction_claims" pour lister dynamiquement les chunks claimés

menu_title: "&2&l Territoires &7| &f%kfaction_name%"
size: 54
type: pagination

open_requirements:
  - type: has_faction

pagination:
  enabled: true
  content_slots: "10-16,19-25,28-34,37-43"
  prev_button_slot: 45
  next_button_slot: 53
  provider: "kfaction_claims"
  empty_message: "&cVotre faction ne possède aucun territoire."

items:
  background:
    slots: "0-9,17-18,26-27,35-36,44-53"
    material: STAINED_GLASS_PANE
    data: 13
    name: " "

  back_button:
    slots: [49]
    material: ARROW
    name: "&cRetour"
    lore:
      - ""
      - "&7Clic pour revenir au menu principal"
    click_actions:
      - "[open] kfaction_menu"

  title_item:
    slots: [4]
    material: MAP
    name: "&2&lTerritoires de la Faction"
    lore:
      - ""
      - "&7Faction: &f%kfaction_name%"
      - "&7Chunks claimés: &f%kfaction_claims%"
      - ""

  prev_button:
    slots: [45]
    material: ARROW
    name: "&ePage précédente"
    lore:
      - ""
      - "&7Page &f%page%&7/&f%max_page%"
      - ""
      - "&aCliquez pour aller à la page précédente"
    view_requirements:
      - type: has_previous_page
    click_actions:
      - "[prev_page]"

  prev_button_disabled:
    slots: [45]
    material: STAINED_GLASS_PANE
    data: 7
    name: " "
    view_requirements:
      - type: "!has_previous_page"

  next_button:
    slots: [53]
    material: ARROW
    name: "&ePage suivante"
    lore:
      - ""
      - "&7Page &f%page%&7/&f%max_page%"
      - ""
      - "&aCliquez pour aller à la page suivante"
    view_requirements:
      - type: has_next_page
    click_actions:
      - "[next_page]"

  next_button_disabled:
    slots: [53]
    material: STAINED_GLASS_PANE
    data: 7
    name: " "
    view_requirements:
      - type: "!has_next_page"
