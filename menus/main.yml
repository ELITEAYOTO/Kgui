# Menu principal exemple
# Démonstration des fonctionnalités de Kgui

# Titre du menu (supporte les placeholders et les couleurs)
title: "&6&lMenu Principal"

# Taille: 9, 18, 27, 36, 45, 54
size: 54

# Template à hériter (optionnel)
template: default_border

# Bloquer le combat (empêche l'ouverture si en combat)
block-combat: true

# Sound à l'ouverture
open-sound: LEVEL_UP

# Conditions pour ouvrir le menu (optionnel)
open-requirements:
  # Permission requise
  permission: kgui.menu.main
  # Deny message si pas les requirements
  deny-message: "&cVous n'avez pas la permission d'ouvrir ce menu!"

# Items du menu
items:
  # Profil du joueur
  profile:
    slot: 13
    item: player_head  # Référence à items/player_head.yml
    # Override du lore pour ce menu spécifique
    lore:
      - ""
      - "&7Bienvenue, &e%player_name%&7!"
      - ""
      - "&7Solde: &a%vault_eco_balance_formatted%"
      - "&7Points: &b%playerpoints_points%"
      - ""
      - "&eCliquez pour voir votre profil"
    left_click_actions:
      - "[open] profile"
    right_click_actions:
      - "[message] &7Votre profil!"
      
  # Boutique
  shop:
    slot: 29
    material: EMERALD
    name: "&a&lBoutique"
    lore:
      - ""
      - "&7Achetez des items et"
      - "&7des améliorations!"
      - ""
      - "&eCliquez pour ouvrir"
    glow: true
    left_click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] shop"
    # Requirements pour cliquer
    click_requirements:
      money:
        type: money
        amount: 100
        deny-message: "&cVous devez avoir au moins 100$ pour accéder à la boutique!"
        
  # Craft personnalisés
  crafts:
    slot: 31
    material: WORKBENCH
    name: "&e&lCrafts"
    lore:
      - ""
      - "&7Découvrez les crafts"
      - "&7personnalisés du serveur!"
      - ""
      - "&eCliquez pour voir"
    left_click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] crafts"
      
  # Classements
  rankings:
    slot: 33
    material: DIAMOND_SWORD
    name: "&c&lClassements"
    lore:
      - ""
      - "&7Consultez les classements"
      - "&7du serveur!"
      - ""
      - "&eCliquez pour voir"
    enchants:
      - DURABILITY:1
    flags:
      - HIDE_ENCHANTS
    left_click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] rankings"
      
  # Informations
  info:
    slot: 49
    material: BOOK
    name: "&b&lInformations"
    lore:
      - ""
      - "&7Règles et informations"
      - "&7sur le serveur"
      - ""
      - "&eCliquez pour voir"
    left_click_actions:
      - "[sound] CLICK 1.0 1.0"
      - "[open] info"
      
  # Fermer
  close:
    slot: 53
    material: BARRIER
    name: "&c&lFermer"
    lore:
      - ""
      - "&7Fermer ce menu"
    left_click_actions:
      - "[close]"
      - "[sound] CLICK 1.0 1.5"
